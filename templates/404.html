<!DOCTYPE html>
<html lang="zh-cmn-Hans">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>页面没找到 - {{ site_title }}</title>
    {% if theme_ready %}
    <link rel="stylesheet" href="{{ static }}/libs/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="{{ static }}/css/origin/function.min.css">
    <link rel="stylesheet" href="{{ static }}/css/handsome.min.css">
    {% else %}
    <link rel="stylesheet" href="/static/fallback.css">
    {% endif %}
</head>
<body>
<div class="app">
    <div class="container w-xxl w-auto-xs">
        <div class="text-center m-b-lg"><h1 class="text-shadow text-white">404</h1></div>
        <div class="list-group bg-info auto m-b-sm m-b-lg">
            <a href="/" class="list-group-item">
                <i class="fontello fontello-chevron-right text-muted"></i>
                <i class="fontello fontello-fw fontello-home m-r-xs"></i>&nbsp;首页
            </a>
        </div>
        <div class="text-center">
            <p><small class="text-muted letterspacing">{{ description }}<br>&copy; {{ year }}</small></p>
        </div>
    </div>
</div>
</body>
</html>
